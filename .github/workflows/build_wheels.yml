name: Build

# Builds and tests release artifacts only. Publishing is the separate,
# manually dispatched publish.yml workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      only:
        # A narrowed run is for debugging one job; publish only from 'all'.
        description: Build and test only this target
        type: choice
        options: [ all, windows-cu132 ]
        default: all

permissions:
  contents: read

jobs:
  build_sdist:
    name: Source distribution
    if: ${{ inputs.only == '' || inputs.only == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-sdist
          path: dist/*.tar.gz

  build_linux:
    name: Wheel on manylinux_2_28 (${{ matrix.variant }})
    if: ${{ inputs.only == '' || inputs.only == 'all' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Built in a manylinux_2_28 container, the glibc baseline of PyTorch's
        # own Linux wheels, so the wheel installs wherever torch does.
        # The artifact keeps the runner name that test_wheels downloads.
        torch-version: [ 2.15.0 ]
        variant: [ cu132 ]
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main

      - name: Build and repair wheel
        run: |
          docker run --rm -v "$PWD:/io" -w /io \
            -e TORCH_VERSION=${{ matrix.torch-version }} -e TORCH_VARIANT=${{ matrix.variant }} \
            -e MAX_JOBS=2 -e TORCHPAIRWISE_PY_LIMITED_API=1 \
            quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2 \
            bash .github/workflows/cuda/manylinux.sh

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-bdist-ubuntu-22.04-${{ matrix.variant }}
          path: ./wheelhouse/*.whl

  build_wheels:
    name: Wheel on ${{ matrix.target.os }} (${{ matrix.target.variant }})
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Wheels pin the torch minor they are built against (see setup.py).
        # PyPI wheels follow the latest torch's PyPI defaults: CUDA on Linux
        # (build_linux), CPU on macOS and Windows. The Windows CUDA wheel matches torch's
        # cu132 index; it carries a +cu132 local version, which PyPI rejects,
        # so its artifact is named extra-* and publish.yml skips it.
        # Each wheel targets the CPython stable ABI, so one build per platform
        # serves every Python version that torch supports.
        python-version: [ '3.11' ]
        torch-version: [ 2.15.0 ]
        target:
          - { os: macos-14, variant: cpu, artifact: artifacts, local: '' }
          - { os: windows-2022, variant: cpu, artifact: artifacts, local: '' }
          - { os: windows-2022, variant: cu132, artifact: extra, local: cu132 }
        only:
          - ${{ inputs.only || 'all' }}
        exclude:
          - { only: windows-cu132, target: { os: macos-14, variant: cpu, artifact: artifacts, local: '' } }
          - { only: windows-cu132, target: { os: windows-2022, variant: cpu, artifact: artifacts, local: '' } }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ninja-build
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install CUDA
        if: ${{ matrix.target.variant != 'cpu' }}
        run: |
          bash .github/workflows/cuda/${{ runner.os }}.sh

      - name: Upgrade build tools
        run: |
          pip install --upgrade setuptools wheel

      - name: Install PyTorch ${{ matrix.torch-version }}
        run: |
          pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/${{ matrix.target.variant }}
          python -c "import torch; print('PyTorch:', torch.__version__); print('CUDA:', torch.version.cuda)"

      - name: Build wheel
        run: |
          if [ "${{ matrix.target.variant }}" = cpu ]; then
            export TORCHPAIRWISE_BUILD_CUDA=0
          else
            source .github/workflows/cuda/${{ runner.os }}-env.sh
          fi
          python setup.py bdist_wheel --dist-dir=wheelhouse
        shell:
          bash
        env:
          MAX_JOBS: '2'
          TORCHPAIRWISE_PY_LIMITED_API: '1'
          TORCHPAIRWISE_LOCAL_VERSION: ${{ matrix.target.local }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}-bdist-${{ matrix.target.os }}-${{ matrix.target.variant }}
          path: ./wheelhouse/*.whl

  test_wheels:
    name: Test ${{ matrix.target.os }} (${{ matrix.target.variant }}) wheel on cp-${{ matrix.python-version }}
    needs: [ build_linux, build_wheels ]
    # Run when build_linux was skipped by a narrowed dispatch, not on failure.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # Runners have no GPU: CUDA wheels are tested for loading and CPU
        # results against their matching CUDA torch.
        python-version: [ '3.11', '3.12', '3.13', '3.14', '3.15' ]
        torch-version: [ 2.15.0 ]
        target:
          - { os: ubuntu-22.04, variant: cu132, artifact: artifacts }
          - { os: macos-14, variant: cpu, artifact: artifacts }
          - { os: windows-2022, variant: cpu, artifact: artifacts }
          - { os: windows-2022, variant: cu132, artifact: extra }
        only:
          - ${{ inputs.only || 'all' }}
        exclude:
          - { only: windows-cu132, target: { os: ubuntu-22.04, variant: cu132, artifact: artifacts } }
          - { only: windows-cu132, target: { os: macos-14, variant: cpu, artifact: artifacts } }
          - { only: windows-cu132, target: { os: windows-2022, variant: cpu, artifact: artifacts } }
          - { only: windows-cu132, python-version: '3.12' }
          - { only: windows-cu132, python-version: '3.13' }
          - { only: windows-cu132, python-version: '3.14' }
          - { only: windows-cu132, python-version: '3.15' }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # torch.compile's CPU backend (Inductor) needs cl on PATH.
      - name: Set up MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}-bdist-${{ matrix.target.os }}-${{ matrix.target.variant }}
          path: wheelhouse

      - name: Test installed wheel
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/${{ matrix.target.variant }}
          pip install pytest pytest-xdist scipy scikit-learn
          # Quoted env var: an unquoted Windows workspace path loses its backslashes.
          pip install --no-deps --no-index --find-links "$GITHUB_WORKSPACE/wheelhouse" torchpairwise
          python -c "import torchpairwise as tp; print('CUDA targets:', tp.extension.cuda_arch_list()); assert tp.with_cuda() == ('${{ matrix.target.variant }}' != 'cpu')"
          python -m pytest "$GITHUB_WORKSPACE/tests" --device cpu -n 2 -q
        env:
          TORCHINDUCTOR_COMPILE_THREADS: '1'
