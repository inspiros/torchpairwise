[metadata]
name = torchpairwise
description = Pairwise Metrics for PyTorch
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE.txt
author = Hoang-Nhat Tran (inspiros)
author_email = hnhat.tran@gmail.com
url = https://github.com/inspiros/torchpairwise
download_url = https://pypi.org/project/torchpairwise/
project_urls =
    Source = https://github.com/inspiros/torchpairwise
    Documentation = https://inspiros.github.io/torchpairwise/
    Changelog = https://github.com/inspiros/torchpairwise/blob/master/CHANGELOG.md
    Issues = https://github.com/inspiros/torchpairwise/issues
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: GPU :: NVIDIA CUDA :: 13
    Intended Audience :: Developers
    Intended Audience :: Education
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    Operating System :: MacOS
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX :: Linux
    Topic :: Scientific/Engineering :: Mathematics
    Topic :: Scientific/Engineering :: Artificial Intelligence
keywords = pairwise_metric,pairwise_distance,kernel_function

[options]
zip_safe = False
include_package_data = True
packages = find:
python_requires = >=3.10

[options.extras_require]
keops = pykeops>=2.2
examples = scipy; scikit-learn; tqdm
tests = pytest>=8; pytest-xdist>=3; scipy; scikit-learn

[options.packages.find]
exclude =
    examples*
    tools*
    docs*
    tests*
    resources*

[options.package_data]
* = *.h, *.hpp, *.cuh, *.c, *.cpp, *.cu, *.pyi, py.typed, sources.json

[tool:pytest]
testpaths = tests
addopts = -ra
markers =
    compiler: PyTorch operator, compilation and export integration checks
    cuda: CUDA-only integration checks
filterwarnings =
    ignore:kulsinski_distances is deprecated:UserWarning
    ignore:kulsinski_distances is deprecated:DeprecationWarning
