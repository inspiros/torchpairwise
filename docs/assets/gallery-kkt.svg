<svg xmlns="http://www.w3.org/2000/svg" width="560" height="224" viewBox="0 0 560 224" role="img" aria-labelledby="title desc">
<title id="title">Kernel Intercept KKT Computation</title>
<desc id="desc">A streamed symmetric kernel and small constraint blocks form a KKT map; MINRES returns kernel coefficients and an intercept.</desc>
<rect width="560" height="224" fill="#10232b"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">
<text x="26" y="30" fill="#f0c783" font-size="11" text-anchor="start">SYMMETRIC INDEFINITE SYSTEM</text>
<rect x="48" y="65" width="65" height="65" rx="4" fill="#69d9c5" opacity=".3"/>
<rect x="118" y="65" width="12" height="65" rx="2" fill="#f0c783" opacity=".8"/>
<rect x="48" y="135" width="65" height="12" rx="2" fill="#f0c783" opacity=".8"/>
<rect x="118" y="135" width="12" height="12" rx="2" fill="#e8b4da" opacity=".4"/>
<text x="80" y="103" fill="#69d9c5" font-size="12">K+αI</text>
<g fill="none" stroke="#f0c783" stroke-width="1.5"><path d="M154 108 H208 m-7 -5 7 5 -7 5"/><path d="M348 108 H402 m-7 -5 7 5 -7 5"/></g>
<rect x="220" y="78" width="118" height="60" rx="12" fill="#423a29" stroke="#f0c783" stroke-opacity=".4"/>
<text x="279" y="115" fill="#f0c783" font-size="20">MINRES</text>
<g fill="#69d9c5" opacity=".6"><rect x="426" y="65" width="15" height="65" rx="2"/><rect x="447" y="65" width="15" height="65" rx="2"/></g>
<g fill="#f0c783" opacity=".85"><rect x="426" y="135" width="15" height="12" rx="2"/><rect x="447" y="135" width="15" height="12" rx="2"/></g>
<g fill="#a9bfc2" font-size="13"><text x="90" y="183">block KKT</text><text x="279" y="183">short recurrence</text><text x="447" y="183">[W; b]</text></g>
</g></svg>
