<svg xmlns="http://www.w3.org/2000/svg" width="560" height="224" viewBox="0 0 560 224" role="img" aria-labelledby="title desc">
<title id="title">Personalized PageRank Computation</title>
<desc id="desc">Directed affinity tiles feed a nonsymmetric GMRES solve to produce personalized vertex ranks.</desc>
