<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle">
<text x="26" y="30" fill="#9ac3ff" font-size="11" text-anchor="start">RECTANGULAR LEAST SQUARES</text>
<g fill="#9ac3ff" opacity=".25">
<rect x="55" y="62" width="20" height="92" rx="3"/><rect x="80" y="62" width="20" height="92" rx="3"/><rect x="105" y="62" width="20" height="92" rx="3"/>
</g>
<rect x="55" y="90" width="70" height="25" rx="3" fill="#9ac3ff" opacity=".8"/>
<g fill="none" stroke="#9ac3ff" stroke-width="1.5"><path d="M154 108 H208 m-7 -5 7 5 -7 5"/><path d="M348 108 H402 m-7 -5 7 5 -7 5"/></g>
<rect x="220" y="78" width="118" height="60" rx="12" fill="#1b3550" stroke="#9ac3ff" stroke-opacity=".4"/>
